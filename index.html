["হালাল রিজিকের দোয়া","اللَّهُمَّ اكْفِنِي بِحَلَالِكَ عَنْ حَرَامِكَ","হে আল্লাহ, আপনার হালাল দিয়ে আমাকে হারাম থেকে অমুখাপেক্ষী করুন।"],

["শয়তান থেকে আশ্রয়","أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ","বিতাড়িত শয়তান থেকে আল্লাহর আশ্রয় চাই।"],
["জান্নাতের দোয়া","اللَّهُمَّ إِنِّي أَسْأَلُكَ الْجَنَّةَ","হে আল্লাহ, আমি আপনার কাছে জান্নাত চাই।"],
["জাহান্নাম থেকে আশ্রয়","اللَّهُمَّ أَجِرْنِي مِنَ النَّارِ","হে আল্লাহ, আমাকে জাহান্নাম থেকে রক্ষা করুন।"],
["ভালো চরিত্রের দোয়া","اللَّهُمَّ اهْدِنِي لِأَحْسَنِ الْأَخْلَاقِ","হে আল্লাহ, আমাকে উত্তম চরিত্রের পথে পরিচালিত করুন।"],
["অন্তরের শান্তি","اللَّهُمَّ طَهِّرْ قَلْبِي","হে আল্লাহ, আমার অন্তর পবিত্র করুন।"],
["ভয় থেকে আশ্রয়","حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ","আল্লাহই আমাদের জন্য যথেষ্ট এবং তিনি উত্তম কর্মবিধায়ক।"],
["সন্তানের জন্য","رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً","হে আমার রব, আমাকে আপনার পক্ষ থেকে নেক সন্তান দান করুন।"],
["পরিবারের জন্য","رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ","হে আমাদের রব, আমাদের স্ত্রী ও সন্তানদের চোখের শীতলতা করুন।"],
["কাজ সহজ হওয়ার দোয়া","رَبِّ اشْرَحْ لِي صَدْرِي","হে আমার রব, আমার বক্ষ প্রশস্ত করুন।"],
["বক্তব্য সহজ হওয়ার দোয়া","وَيَسِّرْ لِي أَمْرِي","এবং আমার কাজ সহজ করে দিন।"],
["ক্ষমা ও রহমত","رَبَّنَا اغْفِرْ لَنَا وَارْحَمْنَا","হে আমাদের রব, আমাদের ক্ষমা করুন ও রহম করুন।"],
["শেষে কবুলের দোয়া","رَبَّنَا تَقَبَّلْ مِنَّا","হে আমাদের রব, আমাদের পক্ষ থেকে কবুল করুন।"]
];

const months=["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const bn="০১২৩৪৫৬৭৮৯",now=new Date();let year=now.getFullYear(),month=now.getMonth();
function bnNum(n){return String(n).replace(/\d/g,d=>bn[d])}
function days(y,m){return new Date(y,m+1,0).getDate()}
function key(y,m,d){return `rd_${y}_${m}_${d}`}
function load(y,m,d){return JSON.parse(localStorage.getItem(key(y,m,d))||"[]")}
function save(y,m,d,a){localStorage.setItem(key(y,m,d),JSON.stringify(a))}
const monthEl=document.getElementById("month");
months.forEach((m,i)=>{let o=document.createElement("option");o.value=i;o.textContent=m+" "+year;monthEl.appendChild(o)});
function updateMonth(){monthEl.value=month}
function render(){
 const holder=document.getElementById("questions");holder.innerHTML="";let total=days(year,month);
 questions.forEach((q,qi)=>{
  let c=document.createElement("section");c.className="card";
  let h=document.createElement("h2");h.className="qtitle";h.textContent=bnNum(qi+1)+". "+q;c.appendChild(h);
  let g=document.createElement("div");g.className="grid";
  for(let d=1;d<=total;d++){let b=document.createElement("button");let a=load(year,month,d),s=a[qi]||0;b.className="day";if(year===now.getFullYear()&&month===now.getMonth()&&d===now.getDate())b.classList.add("today");b.innerHTML=`<span>${bnNum(d)}</span><span class="mark">${s===1?"✓":s===2?"✕":"—"}</span>`;if(s===1)b.classList.add("yes");if(s===2)b.classList.add("no");b.onclick=()=>{let x=load(year,month,d),n=(x[qi]||0)+1;if(n>2)n=0;x[qi]=n;save(year,month,d,x);render()};g.appendChild(b)}
  c.appendChild(g);holder.appendChild(c);
 });
 let a=load(now.getFullYear(),now.getMonth(),now.getDate()),done=a.filter(Boolean).length;
 document.getElementById("summary").textContent=`আজ ${bnNum(done)} / ${bnNum(questions.length)}টি প্রশ্ন পূরণ হয়েছে`;
 updateMonth();
}
function toggleMenu(){document.getElementById("menu").classList.toggle("show")}
function showSection(id){document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");if(id==="duas")renderDuas();window.scrollTo(0,0)}
function renderDuas(){let box=document.getElementById("duaList");box.innerHTML=duas.map((d,i)=>`<div class="dua"><h3>${i+1}. ${d[0]}</h3><div class="arabic">${d[1]}</div><div class="meaning">${d[2]}</div></div>`).join("")}
document.getElementById("prev").onclick=()=>{month--;if(month<0){month=11;year--}render()};
document.getElementById("next").onclick=()=>{month++;if(month>11){month=0;year++}render()};
monthEl.onchange=()=>{month=+monthEl.value;render()};
render();
</script>
</body>
</html>
